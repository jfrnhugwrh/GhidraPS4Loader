name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # This loader uses the Ghidra 9.0 API. Upgrade the source before changing this.
  GHIDRA_TAG: Ghidra_9.0.4_build
  GHIDRA_ARCHIVE: ghidra_9.0.4_PUBLIC_20190516.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.0'

      - name: Download Ghidra
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$GHIDRA_TAG" \
            --repo NationalSecurityAgency/ghidra \
            --pattern "$GHIDRA_ARCHIVE" \
            --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/$GHIDRA_ARCHIVE" -d "$RUNNER_TEMP/ghidra"
          # Archive filenames and their top-level directory names can differ.
          mapfile -t build_scripts < <(find "$RUNNER_TEMP/ghidra" -type f -path '*/support/buildExtension.gradle')
          if [[ ${#build_scripts[@]} -ne 1 ]]; then
            echo "::error::Expected one Ghidra support/buildExtension.gradle, found ${#build_scripts[@]}"
            exit 1
          fi
          ghidra_install_dir="$(dirname "$(dirname "${build_scripts[0]}")")"
          echo "Using Ghidra installation: $ghidra_install_dir"
          echo "GHIDRA_INSTALL_DIR=$ghidra_install_dir" >> "$GITHUB_ENV"

      - name: Build extension
        shell: bash
        run: |
          set -euo pipefail
          # Ghidra 9.0 packages the project directory. Stage only extension files
          # so Git metadata and workflow files cannot end up in the release ZIP.
          project="$RUNNER_TEMP/GhidraPS4Loader"
          mkdir -p "$project"
          cp -R build.gradle extension.properties Module.manifest README.md data src "$project/"
          gradle --no-daemon -p "$project" buildExtension
          mkdir -p dist
          cp "$project"/dist/*.zip dist/
          unzip -t dist/*.zip

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: GhidraPS4Loader-ghidra-9.0.4
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download extension
        uses: actions/download-artifact@v4
        with:
          name: GhidraPS4Loader-ghidra-9.0.4
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BUILD_REF" == refs/tags/v* ]]; then
            release_tag="$REF_NAME"
            release_title="$REF_NAME"
            release_args=(--verify-tag)
          else
            # A unique tag per run preserves history and makes reruns idempotent.
            release_tag="build-$BUILD_RUN_ID"
            release_title="Development build $BUILD_RUN_ID"
            release_args=(--target "$BUILD_SHA" --prerelease --latest=false)
          fi
          if ! gh release view "$release_tag" > /dev/null 2>&1; then
            gh release create "$release_tag" "${release_args[@]}" \
              --title "$release_title" --generate-notes
          fi
          gh release upload "$release_tag" dist/*.zip --clobber
